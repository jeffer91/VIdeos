name: Strengthen no-repeat prompt once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Strengthen no-repeat prompt instruction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update prompt
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/parser.js';
          let source = fs.readFileSync(file, 'utf8');
          const from = `- Cada diapositiva debe aportar información nueva.\n- Evita repetir el mismo dato sin aportar contexto adicional.`;
          const to = `- Cada diapositiva debe aportar información nueva.\n- MUY IMPORTANTE: no repitas contenido entre diapositivas. Si un dato, cifra, comparación o explicación ya apareció, no lo vuelvas a presentar en otra diapositiva salvo que sea imprescindible para entender una idea nueva; en ese caso, no lo copies literalmente y aporta información adicional.\n- Evita repetir el mismo dato sin aportar contexto adicional.`;
          if (!source.includes(from)) throw new Error('No se encontró el bloque del prompt que debía actualizarse.');
          source = source.replace(from, to);
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Verify prompt and UI
        shell: bash
        run: |
          grep -F "no repitas contenido entre diapositivas" src/parser.js
          grep -F "Copiar prompt IA" src/ProductionApp.jsx
          grep -F "Descargar prompt" src/ProductionApp.jsx
          if grep -F "Copiar reglas IA" src/ProductionApp.jsx; then exit 1; fi
          if grep -F "Descargar reglas" src/ProductionApp.jsx; then exit 1; fi

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.js
          git commit -m "Make slide non-repetition explicit"
          git push origin main
