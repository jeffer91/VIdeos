name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check Electron main process
        run: node --check electron/main.cjs
      - name: Check Electron preload
        run: node --check electron/preload.cjs
      - name: Audit workflow integration
        run: npm run audit
      - name: Build renderer
        run: npm run build

  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit Videos Studio
        run: npm run audit
      - name: Build Windows installer
        run: npm run dist:win
      - name: Smoke test packaged app startup
        shell: pwsh
        run: |
          $exe = Resolve-Path 'release/win-unpacked/Videos Studio.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Videos Studio se cerró durante la prueba de arranque. Código: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload installer test artifact
        uses: actions/upload-artifact@v4
        with:
          name: videos-studio-windows-test
          path: |
            release/*.exe
            release/latest*.yml
          if-no-files-found: error
