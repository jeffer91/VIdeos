name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check Electron main process
        run: node --check electron/main.cjs
      - name: Check Electron preload
        run: node --check electron/preload.cjs
      - name: Audit workflow integration
        run: npm run audit
      - name: Build renderer
        run: npm run build
